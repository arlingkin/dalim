name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 0.3.1

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore release signing key
        env:
          DALIM_KEYSTORE_RELEASES: ${{ secrets.DALIM_KEYSTORE_RELEASES }}
        run: |
          if [ -n "$DALIM_KEYSTORE_RELEASES" ]; then
            echo "$DALIM_KEYSTORE_RELEASES" | base64 -d > dalim-release.jks
          fi

      - name: Build, test & lint
        env:
          DALIM_KEYSTORE_FILE: /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/dalim-release.jks
          DALIM_KEYSTORE_PASSWORD: ${{ secrets.DALIM_KEYSTORE_PASSWORD }}
          DALIM_KEY_ALIAS: ${{ secrets.DALIM_KEY_ALIAS }}
          DALIM_KEY_PASSWORD: ${{ secrets.DALIM_KEY_PASSWORD }}
        run: |
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Collect & rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/datalimit-${APP_VERSION}-signed.apk
          cd dist
          sha256sum datalimit-${APP_VERSION}-signed.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: datalimit-apk
          path: dist/*

  release:
    name: Publish GitHub release
    needs: build
    # Only publish from main. Feature-branch / manual validation runs
    # build+test+lint but must not touch the tag.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: datalimit-apk
          path: dist

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Release already exists (e.g. created by a manual run): refresh its assets.
            gh release upload "$TAG" \
              "dist/datalimit-${APP_VERSION}-signed.apk" \
              "dist/SHA256SUMS.txt" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "dist/datalimit-${APP_VERSION}-signed.apk" \
              "dist/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Data Limit v${APP_VERSION}" \
              --notes-file "$GITHUB_WORKSPACE/.github/release-notes.md"
          fi