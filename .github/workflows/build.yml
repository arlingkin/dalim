name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 0.3.0

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore release signing key
        env:
          DALIM_KEYSTORE_BASE64: ${{ secrets.DALIM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DALIM_KEYSTORE_BASE64" ]; then
            echo "$DALIM_KEYSTORE_BASE64" | base64 -d > dalim-release.jks
          fi

      - name: Build signed release APK
        env:
          DALIM_KEYSTORE_FILE: /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/dalim-release.jks
          DALIM_KEYSTORE_PASSWORD: ${{ secrets.DALIM_KEYSTORE_PASSWORD }}
          DALIM_KEY_ALIAS: ${{ secrets.DALIM_KEY_ALIAS }}
          DALIM_KEY_PASSWORD: ${{ secrets.DALIM_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect & rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/datalimit-${APP_VERSION}-signed.apk
          cd dist
          sha256sum datalimit-${APP_VERSION}-signed.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: datalimit-apk
          path: dist/*

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: datalimit-apk
          path: dist

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          gh release create "v${APP_VERSION}" \
            "dist/datalimit-${APP_VERSION}-signed.apk" \
            "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Data Limit v${APP_VERSION}" \
            --notes-file "$GITHUB_WORKSPACE/.github/release-notes.md"