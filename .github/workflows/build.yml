name: Build & Pre-Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 0.2.2-pre

jobs:
  build:
    name: Build unsigned APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK (debug-signed, no release key)
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect & rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/datalimit-${APP_VERSION}-unsigned.apk
          cd dist
          sha256sum datalimit-${APP_VERSION}-unsigned.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: datalimit-apk
          path: dist/*

  release:
    name: Publish GitHub pre-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: datalimit-apk
          path: dist

      - name: Create pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          gh release create "v${APP_VERSION}" \
            "dist/datalimit-${APP_VERSION}-unsigned.apk" \
            "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Data Limit v${APP_VERSION} (pre-release)" \
            --notes-file "$GITHUB_WORKSPACE/.github/release-notes.md"